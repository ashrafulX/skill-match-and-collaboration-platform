{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto my-12 px-4 sm:px-6">
  <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden text-center p-8 sm:p-12 transition-all duration-300 hover:shadow-2xl">
    <!-- Avatar Icon -->
    <div class="w-24 h-24 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-blue-500/30">
      <i class="fas fa-user-circle text-5xl"></i>
    </div>

    <!-- User Name Title -->
    <h3 class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight mb-2">
      This is <span class="text-blue-600">{{ user.first_name }} {{ user.last_name }}</span>
    </h3>
    <p class="text-gray-500 text-base">Welcome to your personal dashboard</p>

    <!-- Quick Navigation Actions -->
    <div class="mt-8 flex flex-wrap justify-center gap-3">
      <a href="{% url 'showProfile' %}" class="inline-flex items-center bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-full shadow-md shadow-blue-500/20 transition-all duration-200 hover:-translate-y-0.5">
        <i class="fas fa-id-card mr-2"></i> View Full Profile
      </a>
      <a href="{% url 'editProfile' %}" class="inline-flex items-center bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold px-6 py-2.5 rounded-full transition-all duration-200">
        <i class="fas fa-user-edit mr-2"></i> Edit Profile
      </a>
    </div>
  </div>
</div>
{% endblock %}
