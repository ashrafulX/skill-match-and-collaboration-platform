{% extends 'base.html' %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6">
    <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
        
        <!-- Danger Header -->
        <div class="bg-gradient-to-r from-rose-600 to-red-700 p-6 sm:p-8 text-white text-center shadow-sm">
            <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-3 backdrop-blur-sm">
                <i class="fas fa-exclamation-triangle text-3xl text-rose-100"></i>
            </div>
            <h3 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Delete Profile</h3>
        </div>

        <!-- Warning Body -->
        <div class="p-6 sm:p-8 text-center space-y-6">
            <div class="bg-rose-50 border border-rose-100 rounded-2xl p-5">
                <p class="text-base font-bold text-rose-900 mb-1">
                    Are you sure you want to delete your profile?
                </p>
                <p class="text-sm text-rose-600 font-medium">
                    This action is permanent and cannot be undone. All your posts and data will be permanently removed.
                </p>
            </div>

            <!-- Action Form & Buttons -->
            <form method="post" class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
                {% csrf_token %}
                <button type="submit" 
                        class="w-full sm:w-auto inline-flex justify-center items-center bg-rose-600 hover:bg-rose-700 text-white font-bold text-base px-8 py-3 rounded-full shadow-lg shadow-rose-600/25 hover:shadow-rose-600/40 transition-all duration-300 hover:-translate-y-0.5">
                    <i class="fas fa-trash-alt mr-2"></i> Yes, Delete
                </button>
                <a href="{% url 'homepage' %}" 
                   class="w-full sm:w-auto inline-flex justify-center items-center bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold text-base px-8 py-3 rounded-full transition-all duration-200">
                    Cancel
                </a>
            </form>
        </div>

    </div>
</div>
{% endblock %}
