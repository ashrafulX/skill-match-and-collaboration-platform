<div class="space-y-6 bg-white p-6 rounded-3xl border border-gray-100 shadow-md">
    <!-- Employment Type Section -->
    <div class="filters space-y-3">
        <h5 class="text-sm font-bold uppercase tracking-wider text-gray-500 mb-3">Type of Employment</h5>
        <div class="space-y-2.5">
            {% for key, value in job_types.items %}
            <label class="flex items-center space-x-3 cursor-pointer group hover:text-blue-600 transition-colors">
                <input 
                    class="filter-checkbox w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer transition" 
                    data-filter="job_type" 
                    value="{{ key }}" 
                    type="checkbox" 
                />
                <span class="text-sm font-medium text-gray-700 group-hover:text-blue-600 transition-colors">
                    {{ value }}
                </span>
            </label>
            {% endfor %}
        </div>
    </div>

    <hr class="border-gray-100">

    <!-- Categories Section -->
    <div class="categories space-y-3">
        <h5 class="text-sm font-bold uppercase tracking-wider text-gray-500 mb-3">Categories</h5>
        <div class="space-y-2.5 max-h-60 overflow-y-auto pr-1">
            {% for cat in categories %}
            <label class="flex items-center space-x-3 cursor-pointer group hover:text-blue-600 transition-colors">
                <input 
                    class="filter-checkbox w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer transition" 
                    data-filter="category" 
                    value="{{ cat.id }}" 
                    type="checkbox" 
                />
                <span class="text-sm font-medium text-gray-700 group-hover:text-blue-600 transition-colors">
                    {{ cat.name }}
                </span>
            </label>
            {% endfor %}
        </div>
    </div>
</div>
